name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'filecoin-project/go-fee'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Go module updates change the library we ship, so they always wait for
      # a manual review. GitHub Actions and the vectors/ts fixture harness
      # don't, so their patch and minor updates merge once CI passes.
      - name: Enable auto-merge for GitHub Actions and vectors/ts updates
        if: >-
          (steps.metadata.outputs.package-ecosystem == 'github_actions' ||
            (steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
              steps.metadata.outputs.directory == '/vectors/ts')) &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
